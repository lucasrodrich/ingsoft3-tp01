name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage (backend)
        run: |
          set -o pipefail
          mkdir -p TestResults/backend
          docker run --rm -v "${{ github.workspace }}/TestResults/backend:/out" backend-test:ci \
            | tee TestResults/backend/pytest-output.txt

      - name: Resumen de coverage en el run (backend)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage — backend"
            echo '```'
            tail -50 TestResults/backend/pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage y resultados (backend)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-backend
          path: |
            TestResults/backend/htmlcov
            TestResults/backend/coverage.xml
            TestResults/backend/junit.xml

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # ${{ github.repository }} ya está en minúsculas (lucasrodrich/ingsoft3-tp01);
          # si tu usuario/repo tuviera mayúsculas, ghcr.io rechaza el push y hay que escribirlo a mano.
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          # provenance/sbom necesitan permisos extra (attestations: write / id-token: write)
          # que no usamos para nada más en este TP: se desactivan en vez de sumarlos.
          provenance: false
          sbom: false

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests con coverage (frontend)
        run: |
          set -o pipefail
          mkdir -p TestResults/frontend
          docker run --rm -v "${{ github.workspace }}/TestResults/frontend:/out" frontend-test:ci \
            | tee TestResults/frontend/vitest-output.txt

      - name: Resumen de coverage en el run (frontend)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage — frontend"
            echo '```'
            tail -20 TestResults/frontend/vitest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar coverage y resultados (frontend)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-frontend
          path: TestResults/frontend/coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false
          sbom: false

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # El `&ref=` hace que Render despliegue ESTE commit y no la punta de la rama
      # (el hook ya trae `?key=...`, por eso va `&`).
      - name: Disparar deploy en Render (backend + front) — del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      # Smoke con reintentos (cold start + build de Render). Prueba: que el backend
      # corre ESTE commit (SHA en /health, que además hace SELECT 1), front servido, y la BD de punta a punta:
      # registra/loguea un usuario de prueba y lee un endpoint autenticado.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: ${{ vars.QA_API_URL }}
          URL_FRONT: ${{ vars.QA_FRONT_URL }}
          SMOKE_EMAIL: smoke-qa@restoflow-smoke.dev
          SMOKE_PASSWORD: smoke-qa-password-1
        run: |
          echo "Esperando a que QA esté vivo..."
          CREDS=$(jq -nc --arg e "$SMOKE_EMAIL" --arg p "$SMOKE_PASSWORD" '{email:$e,password:$p}')
          REG=$(jq -nc --arg e "$SMOKE_EMAIL" --arg p "$SMOKE_PASSWORD" '{nombre:"Smoke QA",email:$e,password:$p}')
          for i in $(seq 1 30); do
            echo "Intento $i/30"
            # /health devuelve el SHA que corre el backend: mientras Render siga
            # construyendo contesta el SHA viejo y reintentamos.
            SHA_RUNNING=$(curl -fsS --max-time 10 "$URL_API/health" | jq -r .sha) || SHA_RUNNING=""
            echo "  backend corre: ${SHA_RUNNING:-sin respuesta} (esperado: $GITHUB_SHA)"
            if [ "$SHA_RUNNING" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              # 201 la primera vez, 409 si el usuario ya existe: ambos están bien
              curl -sS --max-time 20 -o /dev/null -X POST "$URL_API/api/auth/register" \
                -H 'Content-Type: application/json' -d "$REG" || true
              TOKEN=$(curl -fsS --max-time 20 -X POST "$URL_API/api/auth/login" \
                -H 'Content-Type: application/json' -d "$CREDS" | jq -r .token) || TOKEN=""
              if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] \
                 && curl -fsS --max-time 10 -H "Authorization: Bearer $TOKEN" \
                      "$URL_API/api/categorias" > /dev/null; then
                echo "✅ QA responde (API + BD + front)"; exit 0
              fi
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1
